<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
    <h1>LIBRARY</h1>
    <div class="content">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <img src="images/library1.png" alt="Image" class="img-fluid">
                </div>
                <div class="col-md-6 contents">
                    <div class="row justify-content-center">
                        <div class="col-md-8">
                          <img src="images/logo (1).png" alt="no-image" style="margin: 0px 0px 10px 33%">
                            <div class="mb-4">
                                <div data-mdb-input-init class="form-outline mb-4">
                                    <input type="email" id="form2Example1" class="form-control" />
                                    <label class="form-label" for="form2Example1">Email address</label>
                                  </div>
                                
                                  <!-- Password input -->
                                  <div data-mdb-input-init class="form-outline mb-4">
                                    <input type="password" id="form2Example2" class="form-control" />
                                    <label class="form-label" for="form2Example2">Password</label>
                                  </div>
                                
                                  <!-- 2 column grid layout for inline styling -->
                                  <div class="row mb-4">
                                    <div class="col d-flex justify-content-center">
                                      <!-- Checkbox -->
                                      <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
                                        <label class="form-check-label" for="form2Example31"> Remember me </label>
                                      </div>
                                    </div>
                                
                                    <div class="col">
                                      <!-- Simple link -->
                                      <a href="#!">Forgot password?</a>
                                    </div>
                                  </div>
                                
                                  <!-- Submit button -->
                                  <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">Sign in</button>
                                
                                  <!-- Register buttons -->
                                  <div class="text-center">
                                    <p>Not a member? <a href="#!">Register</a></p>
                                    <p>or sign up with:</p>
                                    <button  type="button" data-mdb-button-init data-mdb-ripple-init class="www.google.com">
                                        <i class="fab fa-google"></i>
                                      </button>
                                  </div>

                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
</body>
</html>
