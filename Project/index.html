<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Homepage</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url('/images/LMS.png') no-repeat center center/cover;
            color: rgb(228, 13, 13);
        }
        .Header-section{
                background-image: linear-gradient(0deg, rgba(21, 26, 26, 0.2), #23080b), url(/images/LMS.png);
                background-position: center;
                background-repeat: no-repeat;
                background-size: cover;
                height: 800px;
            
        }
        .search-bar {
            margin-top: 150px;
            background-color: #121214c4;
        }
        .search-bar input {
            border-radius: 30px 0 0 30px;
        }
        .search-bar button {
            border-radius: 0 30px 30px 0;
        }
        .ask-librarian {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }
        .navbar .nav-link {
            color: rgb(255, 255, 255) !important;
        }
        .bg-primary {
            --bs-bg-opacity: 1;
            background-color:#141101 !important;
        
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="Header-section">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">BAIUST Library</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Resources</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Subject Guide</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Downloads</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacts</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Search Bar -->
    <div class="container text-center search-bar">
        
        <form class="d-flex justify-content-center">
            <input type="text" class="form-control w-50" placeholder="Search for books, ebooks, journals, and repository items...">
            <button type="submit" class="btn btn-warning"><i class="bi bi-search"></i>Search</button>
        </form>
        <div class="mt-3">
            <a href="#" class="text-light me-3 ">Classic Catalogue</a>
            <a href="#" class="text-light me-3">Databases A-Z</a>
            <a href="#" class="text-light me-3">Institutional Repository</a>
            <a href="#" class="text-light">Data Repository</a>
        </div>
    </div>
</div>

    <!-- Ask a Librarian Button -->
    <button class="btn btn-primary ask-librarian">Ask a Librarian</button>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
